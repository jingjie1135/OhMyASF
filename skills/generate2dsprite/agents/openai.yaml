interface:
  display_name: "Generate 2D Sprite"
  short_description: "Pixel sprites, clean HD props, bundles, and transparent GIFs."
  default_prompt: "Use $generate2dsprite to create clean game sprites or map props that match the current map style; write <run-dir>/imagegen-request.json and run ohmyasf generate --run-dir <run-dir> for every raw sprite image, then read <run-dir>/raw/imagegen-manifest.json for the raw PNG path; do not search for provider config paths during normal generation because ohmyasf setup creates the default config; raw sprite art must originate from the configured OpenAI-compatible provider, not Three.js, Canvas, SVG, HTML/CSS drawing, PIL shape drawing, procedural geometry, placeholder primitives, or code-rendered screenshots; for characters, creatures, NPCs, enemies, summons, animated props, and hero actions, do not generate raw single-row sheets like 1x4/1x6/1x8, use centered multi-row grids instead: 4 frames -> 2x2, 6 frames -> 2x3, longer actions -> 2x4/3x3/3x4/4x4, then assemble engine strips or atlases only after QC; choose --cell-size deliberately based on asset type, target runtime, and delivery size, and rely on omitted --cell-size only as a safety fallback that preserves source per-cell resolution instead of shrinking to the old 96/128 defaults; standard sprite sheets default to 2K square models, simple icons/portraits/projectiles/impacts/FX/tiny props route to 1K roles, and dense 5x5/6x6 grids route to 4K when model_policy.grid_rows/grid_cols are set; for controllable heroes and main characters, attack/shoot/cast body sheets must be body-only by default, preserving idle/run body scale and feet anchor, with slash arcs, weapon trails, muzzle flashes, projectiles, dust, and impacts generated as separate FX/projectile/impact sheets unless the runtime explicitly supports wider per-action cells and origins; use component_mode=largest for hero body grids and component_mode=all for separate FX/projectile/impact sheets; for map prop packs, classify assets first and use square 2x2/3x3/4x4 sheets only for compact props, while floors, platforms, bridges, walls, ladders, gates, doors, long hazards, wide/tall props, collision-aligned objects, and tileset/strip pieces must use one-by-one generation, platform strips, custom wide cells, or tileset-like atlases."
